<div class="form">

        Please <a href="/login">login</a> if you already have an account.

      <div class="tab-content">
        <div id="signup">
          <h1>Sign Up </h1>

          <form action="/register" method="post">

          <div class="top-row">
            <div class="field-wrap">
              <label>
                First Name<span class="req">*</span>
              </label>
              <input type="text"  name="prenom" autocomplete="off" />
            </div>
          </div>

            <div class="field-wrap">
              <label>
                Last Name<span class="req">*</span>
              </label>
              <input type="text" name="nom" required autocomplete="off"/>
            </div>


          <div class="field-wrap">
            <label>
              Email Address<span class="req">*</span>
            </label>
            <input type="email" name="email" required autocomplete="off"/>
          </div>

          <div class="field-wrap">
            <label>
              Set A Password<span class="req">*</span>
            </label>
            <input type="password"name="password" required autocomplete="off"/>
          </div>
               <div class="field-wrap">
            <label>
              Confirm Password<span class="req">*</span>
            </label>
            <input type="password" name="confirm_password" required autocomplete="off"/>
          </div>

    <div class="tacbox">
  <input id="checkbox" type="checkbox" />
  <label for="checkbox"> I agree to these <a href="#">Terms and Conditions</a>.</label>
    </div>
              <button type="submit" class="button button-block"/>Get Started</button>

          </form>
        </div>
      </div>
